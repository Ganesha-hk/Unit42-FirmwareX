name: firmwarex
x-control: &control
  image: firmwarex-control:day1
  build:
    context: .
    dockerfile: infra/images/control/Dockerfile
  environment: &environment
    FWX_DATABASE_URL: postgresql+psycopg://fwxapp:${FWX_DB_PASSWORD}@postgres/firmwarex
    FWX_REDIS_URL: redis://redis:6379/0
    FWX_API_TOKEN: ${FWX_API_TOKEN}
    FWX_COMPANY_REGISTRATION_CODE: ${FWX_COMPANY_REGISTRATION_CODE:-}
    FWX_SESSION_COOKIE_SECURE: ${FWX_SESSION_COOKIE_SECURE:-false}
    FWX_HOST_STORAGE: ${FWX_HOST_STORAGE}
    FWX_STORAGE: /data
    FWX_MENTOR_AUTHORIZED_EXECUTION: ${FWX_MENTOR_AUTHORIZED_EXECUTION:-false}
    FWX_SANDBOX_UID: ${FWX_SANDBOX_UID:-1000}
    FWX_SANDBOX_GID: ${FWX_SANDBOX_GID:-1000}
  networks: [control]
  volumes:
    - ${FWX_HOST_STORAGE}:/data
services:
  postgres:
    image: postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: firmwarex
      POSTGRES_PASSWORD: ${FWX_ADMIN_PASSWORD}
      FWX_DB_PASSWORD: ${FWX_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/10-role.sh:ro
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d firmwarex"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes: [queue:/data]
    networks: [control]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    <<: *control
    environment:
      <<: *environment
      FWX_MIGRATION_URL: postgresql+psycopg://postgres:${FWX_ADMIN_PASSWORD}@postgres/firmwarex
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *control
    networks: [control, ingress]
    user: "${FWX_SANDBOX_UID:-1000}:${FWX_SANDBOX_GID:-1000}"
    ports: ["127.0.0.1:${FWX_HTTP_PORT:-8000}:8000"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=150m,mode=1777"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  dispatcher:
    <<: *control
    command: ["celery", "-A", "firmwarex.tasks:app", "worker", "--loglevel=WARNING", "--concurrency=1", "--hostname=dispatcher"]
    volumes:
      - ${FWX_HOST_STORAGE}:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  scheduler:
    <<: *control
    command: ["celery", "-A", "firmwarex.tasks:app", "beat", "--loglevel=WARNING", "--schedule=/tmp/celerybeat"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
networks:
  ingress: {}
  control:
    internal: true
volumes:
  database:
  queue:
